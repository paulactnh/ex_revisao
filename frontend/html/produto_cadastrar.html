<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/produto_cadastrar.js"defer></script>
    <title>Cadastrar Produto</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Cadastrar Produto</h1>
        <form>
            <label for="descricao">Descrição:</label><br>
            <input type="text" id="descricao"><br><br>

            <label for="categoria">Categoria:</label><br>
            <input type="text" id="categoria"><br><br>
            
            <label for="qtdeEstoque">Quantidade de Estoque:</label><br>
            <input type="number" id="qtdeEstoque"><br><br>
            
            <label for="lote">Lote:</label><br>
            <input type="text" id="lote"><br><br>

            <label for="idFornecedor">Código do Fornecedor:</label><br>
            <input type="number" id="idFornecedor"><br><br>

            <button id="btn_cad">Cadastrar</button>
        </form>
        <div id="res"></div>
    </main>
</body>
</html>
