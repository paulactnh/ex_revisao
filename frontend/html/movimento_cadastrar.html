<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/movimento_cadastrar.js"defer></script>
    <title>Cadastrar Movimento</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Cadastrar Movimento</h1>
        <form>
            <label for="tipo">Tipo:</label><br>
            <select id="tipo">
                <option value="ENTRADA">Entrada</option>
                <option value="SAIDA">Saída</option>
            </select><br><br>

            <label for="qtdeMovimento">Quantidade a ser movimentada:</label><br>
            <input type="number" id="qtdeMovimento"><br><br>
            
            <label for="data">Data</label><br>
            <input type="date" id="data"><br><br>

            <label for="idProduto">Código do Produto:</label><br>
            <input type="number" id="idProduto"><br><br>

            <button id="btn_cad">Cadastrar</button>
        </form>
        <div id="res"></div>
    </main>
</body>
</html>
